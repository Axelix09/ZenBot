<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
  <title id="title">ZenBot — el bot que le pone vida al grupo</title>
  <desc id="desc">Banner oscuro con acentos violeta y turquesa, un pequeño robot y el nombre ZenBot.</desc>
  <defs>
