      <stop stop-color="#7de5d0"/>
      <stop offset="1" stop-color="#aa91ee"/>
    </linearGradient>
    <pattern id="grain" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".8" fill="#dfe3f3" opacity=".16"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
