<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">ZenBot</title>
  <desc id="desc">Banner de ZenBot con un símbolo original de chat y robot en tonos noche, turquesa y violeta.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
